services:
  - type: web
    name: eclipse-hunter-api
    env: python
    region: frankfurt
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: EH_CACHE_BACKEND
        value: auto
      - key: EH_REDIS_URL
        fromDatabase:
          name: eclipse-hunter-redis
          property: connectionString
      - key: EH_CORS_ORIGINS
        value: "*"
      - key: EH_LOG_LEVEL
        value: INFO
      - key: EH_USER_AGENT
        value: EclipseHunter/1.0 (+https://github.com/yourname/eclipse-hunter)

databases:
  - name: eclipse-hunter-redis
    plan: free
    databaseName: eclipse-hunter
    ipAllowList: []
