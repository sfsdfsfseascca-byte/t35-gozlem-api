name: Build APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'frontend/**'
      - '.github/workflows/build_apk.yml'
      - 'eclipse-hunter/frontend/**'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend API URL (e.g. https://your-api.fly.dev)'
        required: false
        default: 'https://your-api.fly.dev'
        type: string

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    # --- PLACEHOLDER: Change this default or set it in GitHub Settings ---
    # Priority: 1. Manual input 2. Repo Variable 3. Repo Secret 4. Default below
    env:
      API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL || secrets.API_BASE_URL || 'https://your-api.fly.dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Locate frontend directory
        id: locate
        run: |
          if [ -d "frontend/pubspec.yaml" ]; then
            echo "FRONTEND_DIR=frontend" >> $GITHUB_ENV
            echo "dir=frontend" >> $GITHUB_OUTPUT
          elif [ -d "eclipse-hunter/frontend/pubspec.yaml" ]; then
            echo "FRONTEND_DIR=eclipse-hunter/frontend" >> $GITHUB_ENV
            echo "dir=eclipse-hunter/frontend" >> $GITHUB_OUTPUT
          else
            echo "Could not find frontend/pubspec.yaml"
            find . -name pubspec.yaml | head -20
            exit 1
          fi
          echo "Using frontend dir: $FRONTEND_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          echo "Building with API_BASE_URL=${{ env.API_BASE_URL }}"
          flutter build apk --release --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      - name: Rename APK with timestamp
        run: |
          cd ${{ env.FRONTEND_DIR }}/build/app/outputs/flutter-apk/
          ls -lh
          cp app-release.apk eclipse-hunter-${{ github.sha }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-hunter-apk
          path: |
            ${{ env.FRONTEND_DIR }}/build/app/outputs/flutter-apk/app-release.apk
            ${{ env.FRONTEND_DIR }}/build/app/outputs/flutter-apk/eclipse-hunter-${{ github.sha }}.apk
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        run: |
          echo "### APK Built Successfully! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Backend URL used:** \`${{ env.API_BASE_URL }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Download:** Go to Actions tab > this run > Artifacts > eclipse-hunter-apk" >> $GITHUB_STEP_SUMMARY
